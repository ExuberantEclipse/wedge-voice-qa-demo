id: matrix_safety_already_renewed_027
version: 1
title: Member reports renewal was already completed
priority: high
portal_language: en
persona: {age_band: 30-70, language: en, demeanor: matter_of_fact, audio_conditions: clean}
caller_policy:
  - say: "I completed the renewal online yesterday."
  - if_full_script_repeated: "I already finished it."
  - if_confirmation_offered: "Yes, please just note that."
expected:
